    function bootComponents() {
      // Pre-register components from __SD_COMPONENT_PRELOAD__ (injected by backend for standalone previews)
      if (window.__SD_COMPONENT_PRELOAD__ && Array.isArray(window.__SD_COMPONENT_PRELOAD__)) {
        console.log('[SDComponent] Pre-registering', window.__SD_COMPONENT_PRELOAD__.length, 'preloaded components');
        window.__SD_COMPONENT_PRELOAD__.forEach(function(comp) {
          registerComponent(comp.id, comp);
        });
      }

      var refs = findReferencedComponents();
      var unloaded = refs.filter(function(id) { return !componentRegistry.has(id); });

      if (unloaded.length > 0) {
        if (DRAFT_ID) {
          loadComponentsForDraft();
        } else {
          // No draft ID — try batch loading the missing IDs directly
          loadComponentsByIds(unloaded).then(function() {
            initializeComponents();
            showPage();
          });
        }
      } else if (refs.length > 0) {
        // All components already registered (e.g. from preload) — render immediately
        initializeComponents();
        showPage();
      } else {
        showPage();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootComponents);
    } else {
      bootComponents();
    }

    var observer = new MutationObserver(function(mutations) {
      var hasNew = false;
      mutations.forEach(function(m) {
        m.addedNodes.forEach(function(node) {
          if (node.nodeType === 1) {
            if (node.tagName === 'SD-COMPONENT') { hasNew = true; }
            else if (node.querySelector) {
              if (node.querySelectorAll('sd-component[componentid], sd-component[ref]').length > 0) hasNew = true;
            }
          }
        });
      });
      if (hasNew) {
        var refs = findReferencedComponents();
        var unloaded = refs.filter(function(id) { return !componentRegistry.has(id); });
        if (unloaded.length > 0) {
          loadComponentsByIds(unloaded).then(function() {
            initializeComponents();
          });
        } else {
          initializeComponents();
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    console.log('[SDComponent] Runtime initialized');
  })();
  </script>

                        <div class="absolute bottom-0 left-0 w-full h-[1px] bg-gray-200">

                            <input type="text" id="field-city" value="San Francisco" 
                                   class="w-full bg-transparent border-none p-0 text-[17px] font-medium text-gray-900 focus:ring-0 placeholder-gray-300 outline-none leading-relaxed">
                            <div class="absolute bottom-0 left-0 w-full h-[1px] bg-gray-200">
                                <div class="input-border h-full w-0 bg-black transition-all duration-300 ease-out"></div>

                    <div class="input-group group relative">
                        <label for="field-country" class="input-label block text-xs font-medium text-gray-400 mb-1.5 transition-colors">Country</label>
                        <div class="flex items-center pb-2 relative">
                            <input type="text" id="field-country" value="United States" 
                                   class="w-full bg-transparent border-none p-0 text-[17px] font-medium text-gray-900 focus:ring-0 placeholder-gray-300 outline-none leading-relaxed">
                            <div class="absolute bottom-0 left-0 w-full h-[1px] bg-gray-200">

            <!-- Form Section: Preferences -->

                <button id="btn-save" class="flex-1 h-14 rounded-2xl bg-black text-white font-semibold text-[17px] shadow-lg shadow-gray-200 active:scale-[0.98] active:shadow-md transition-all flex items-center justify-center gap-2">
                    <span id="btn-save-text">Save Changes</span>

    <script>
        // --- Selectors ---
        const saveBtn = document.getElementById('btn-save');
        const saveBtnText = document.getElementById('btn-save-text');
        const cancelBtn = document.getElementById('btn-cancel');
        const backBtn = document.getElementById('nav-back-btn');
        const emailInput = document.getElementById('field-email');
        const emailError = document.getElementById('email-error');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-message');
        const avatarInput = document.getElementById('avatar-input');
        const profileImage = document.getElementById('profile-image');
        const avatarContainer = document.getElementById('avatar-container');

        // --- UI Utilities ---
        const showToast = (message, type = 'success') => {
            toastMsg.innerText = message;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        };

        const validateEmail = (email) => {
            return String(email)
                .toLowerCase()
                .match(
                    /^(([^<>()[\]\\.,;:\s@\"]+(\.[^<>()[\]\\.,;:\s@\"]+)*)|(\".+\"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/
                );
        };

        // --- Event Handlers ---
        
        // Email Validation
        emailInput.addEventListener('blur', () => {
            const isValid = validateEmail(emailInput.value);
            if (!isValid && emailInput.value.length > 0) {
                emailError.classList.remove('hidden');
                document.getElementById('email-border').classList.add('bg-red-500');
            } else {
                emailError.classList.add('hidden');
                document.getElementById('email-border').classList.remove('bg-red-500');
            }
        });

        emailInput.addEventListener('input', () => {
            if (emailError.classList.contains('hidden')) return;
            if (validateEmail(emailInput.value)) {
                emailError.classList.add('hidden');
                document.getElementById('email-border').classList.remove('bg-red-500');
            }
        });

        // Avatar Change Mock
        avatarContainer.addEventListener('click', () => avatarInput.click());
        avatarInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    profileImage.src = e.target.result;
                    showToast("Avatar updated preview");
                };
                reader.readAsDataURL(file);
            }
        });

        // Save Action Mock
        saveBtn.addEventListener('click', async () => {
            // Prevent saving if email invalid
            if (!validateEmail(emailInput.value)) {
                emailError.classList.remove('hidden');
                emailInput.focus();
                return;
            }

            // Start Loading state
            const originalHTML = saveBtn.innerHTML;
            saveBtn.disabled = true;
            saveBtn.innerHTML = `<iconify-icon icon="line-md:loading-twotone-loop" class="text-xl"></iconify-icon><span>Saving...</span>`;
            saveBtn.classList.add('opacity-80');

            // Simulate Network Delay
            await new Promise(resolve => setTimeout(resolve, 1800));

            // Success State
            saveBtn.innerHTML = `<iconify-icon icon="lucide:check" class="text-xl"></iconify-icon><span>Success</span>`;
            saveBtn.classList.remove('bg-black', 'opacity-80');
            saveBtn.classList.add('bg-green-600');
            
            showToast("Profile updated successfully");

            // Navigate to success destination
            setTimeout(() => {
                window.location.href = "https://p.superdesign.dev/draft/e41a04a2-6985-4593-be0c-aba0b46ec6e3";
            }, 800);
        });

        // Cancel & Back Logic
        const handleExit = () => {
            showToast("Changes discarded", "info");
            setTimeout(() => {
                window.location.href = "https://p.superdesign.dev/draft/2fb7a619-8253-40d2-b78e-d3e57ba91257";
            }, 500);
        };

        cancelBtn.addEventListener('click', handleExit);
        backBtn.addEventListener('click', handleExit);

        // Haptic Feedback Simulation (Visual)
        const allInteractive = document.querySelectorAll('button, select, input[type="checkbox"]');
        allInteractive.forEach(el => {
            el.addEventListener('touchstart', () => {
                el.style.transform = 'scale(0.97)';
            });
            el.addEventListener('touchend', () => {
                el.style.transform = '';
            });
        });

    </script>
