 --ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif;
 -webkit-font-smoothing:antialiased;min-height:100svh;display:grid;place-items:center;
 padding:clamp(22px,4vw,48px)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--muted)}
.panel{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);
 border-radius:14px;padding:clamp(20px,3.4vw,30px);box-shadow:0 1px 2px rgba(9,9,11,.04)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
h1{font-size:1.16rem;font-weight:600;letter-spacing:-.02em}
.top p{margin-top:4px;color:var(--muted);font-size:.9rem}
.pill{flex:none;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;
 background:var(--live-soft);color:var(--live)}
.rows{margin-top:22px}
.r{position:relative;display:grid;grid-template-columns:26px 1fr auto;gap:14px;
 padding:13px 0;align-items:start}
/* the connector is drawn per row so a row can be inserted without recomputing anything */
.r:not(:last-child)::before{content:"";position:absolute;left:12px;top:32px;bottom:-1px;width:2px;
 background:var(--line)}
.r.done:not(:last-child)::before{background:var(--ok)}
.mk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
 border:2px solid var(--line);background:var(--card);position:relative;z-index:1}
.r.done .mk{border-color:var(--ok);background:var(--ok-soft)}
.r.live .mk{border-color:var(--live);background:var(--live-soft)}
.mk svg{width:12px;height:12px;stroke-width:3;fill:none;stroke:var(--ok);
 stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .4s var(--ease)}
.r.done .mk svg{opacity:1}
.mk .pulse{width:8px;height:8px;border-radius:50%;background:var(--live);opacity:0}
.r.live .mk .pulse{opacity:1;animation:pl 1.8s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.55}}
.r b{display:block;font-size:.95rem;font-weight:600;letter-spacing:-.012em}
.r.wait b{color:var(--wait);font-weight:500}
.r span.s{display:block;margin-top:3px;font-size:.85rem;line-height:1.5;color:var(--muted)}
.r .t{white-space:nowrap;padding-top:2px}
.foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
 display:flex;justify-content:space-between;gap:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

          headers: { 'Content-Type': 'application/json' },
        });
        if (!response.ok) throw new Error('Failed to load components: ' + response.status);
        var components = await response.json();
        console.log('[SDComponent] Loaded', components.length, 'components');
        components.forEach(function(comp) { registerComponent(comp.id, comp); });
        initializeComponents();
        showPage();
      } catch (error) {
        console.error('[SDComponent] Failed to load components:', error);
        showPage();
      }
    }

    function findReferencedComponents() {
      var elements = document.querySelectorAll('sd-component[componentid], sd-component[ref]');
      var ids = new Set();
      elements.forEach(function(el) {
        var ref = el.getAttribute('componentid') || el.getAttribute('ref');
        if (ref) ids.add(ref);
      });
      return Array.from(ids);
    }

    window.__SD_COMPONENTS__ = {
      register: registerComponent,
      render: renderComponent,
      update: updateComponentInstances,
      loadForDraft: loadComponentsForDraft,
      loadByIds: loadComponentsByIds,
      init: initializeComponents,
      findRefs: findReferencedComponents,
      getRegistry: function() { return componentRegistry; },
      getInstances: function() { return instanceRegistry; },
      getDraftId: function() { return DRAFT_ID; },
    };

    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'SD_COMPONENT_UPDATE') {
        var cId = event.data.componentId;
        var def = event.data.definition;
        if (cId && def) { registerComponent(cId, def); updateComponentInstances(cId); }
      }
      if (event.data && event.data.type === 'SD_COMPONENTS_REGISTER') {
        var comps = event.data.components;
        if (Array.isArray(comps)) {
          comps.forEach(function(c) { registerComponent(c.id, c); });
          initializeComponents();
        }
      }
    });

    function bootComponents() {
      // Pre-register components from __SD_COMPONENT_PRELOAD__ (injected by backend for standalone previews)
      if (window.__SD_COMPONENT_PRELOAD__ && Array.isArray(window.__SD_COMPONENT_PRELOAD__)) {
        console.log('[SDComponent] Pre-registering', window.__SD_COMPONENT_PRELOAD__.length, 'preloaded components');
        window.__SD_COMPONENT_PRELOAD__.forEach(function(comp) {
          registerComponent(comp.id, comp);
        });
      }

      var refs = findReferencedComponents();
      var unloaded = refs.filter(function(id) { return !componentRegistry.has(id); });

      if (unloaded.length > 0) {
        if (DRAFT_ID) {
          loadComponentsForDraft();
        } else {
          // No draft ID — try batch loading the missing IDs directly
          loadComponentsByIds(unloaded).then(function() {
            initializeComponents();
            showPage();
          });
        }
      } else if (refs.length > 0) {
        // All components already registered (e.g. from preload) — render immediately
        initializeComponents();
        showPage();
      } else {
        showPage();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootComponents);
    } else {
      bootComponents();
    }

    var observer = new MutationObserver(function(mutations) {
      var hasNew = false;
      mutations.forEach(function(m) {
        m.addedNodes.forEach(function(node) {
          if (node.nodeType === 1) {
            if (node.tagName === 'SD-COMPONENT') { hasNew = true; }
            else if (node.querySelector) {
              if (node.querySelectorAll('sd-component[componentid], sd-component[ref]').length > 0) hasNew = true;
            }
          }
        });
      });
      if (hasNew) {
        var refs = findReferencedComponents();
        var unloaded = refs.filter(function(id) { return !componentRegistry.has(id); });
        if (unloaded.length > 0) {
          loadComponentsByIds(unloaded).then(function() {
            initializeComponents();
          });
        } else {
          initializeComponents();
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    console.log('[SDComponent] Runtime initialized');
  })();
  </script>
</head><body>
<div class="panel">

  </div>

</div>

(function(){
 "use strict";
 var S=[["done","Order received","Payment authorised and the basket was locked.","09:14"],
 ["done","Picked","Every line was in stock, so nothing was substituted.","09:41"],
 ["done","Packed","Two parcels, because the long item will not fit the standard box.","10:26"],
 ["live","In transit","Left the depot. The courier has eleven stops before yours.","11:03"],
 ["wait","Delivered","A photo and a signature go to both parties on arrival.",""]];
 var rows=document.getElementById("rows");
 var CHECK='<svg viewBox="0 0 24 24"><path d="M4 12.5l5.2 5.2L20 7"/></svg>';
 S.forEach(function(s){
   var d=document.createElement("div"); d.className="r "+s[0];
   d.innerHTML='<span class="mk">'+CHECK+'<span class="pulse"></span></span>'+
     '<div><b>'+s[1]+'</b><span class="s">'+s[2]+'</span></div>'+
     '<span class="t mono">'+(s[3]||"&mdash;").replace("&mdash;","")+'</span>';
   rows.appendChild(d);
 });
 var done=S.filter(function(s){return s[0]==="done";}).length;
 document.getElementById("prog").textContent=done+" of "+S.length+" complete";
 var live=S.some(function(s){return s[0]==="live";});
 document.getElementById("pill").textContent = live ? "In progress" : "Complete";
})();
