      var refs = findReferencedComponents();
      var unloaded = refs.filter(function(id) { return !componentRegistry.has(id); });

      if (unloaded.length > 0) {
        if (DRAFT_ID) {
          loadComponentsForDraft();
        } else {
          // No draft ID — try batch loading the missing IDs directly
          loadComponentsByIds(unloaded).then(function() {
            initializeComponents();
            showPage();
          });
        }
      } else if (refs.length > 0) {
        // All components already registered (e.g. from preload) — render immediately
        initializeComponents();
        showPage();
      } else {
        showPage();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootComponents);
    } else {
      bootComponents();
    }

    var observer = new MutationObserver(function(mutations) {
      var hasNew = false;
      mutations.forEach(function(m) {
        m.addedNodes.forEach(function(node) {
          if (node.nodeType === 1) {
            if (node.tagName === 'SD-COMPONENT') { hasNew = true; }
            else if (node.querySelector) {
              if (node.querySelectorAll('sd-component[componentid], sd-component[ref]').length > 0) hasNew = true;
            }
          }
        });
      });
      if (hasNew) {
        var refs = findReferencedComponents();
        var unloaded = refs.filter(function(id) { return !componentRegistry.has(id); });
        if (unloaded.length > 0) {
          loadComponentsByIds(unloaded).then(function() {
            initializeComponents();
          });
        } else {
          initializeComponents();
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    console.log('[SDComponent] Runtime initialized');
  })();
  </script>
</head>
<body>
  <div class="w-full h-screen bg-white text-gray-900 flex flex-col overflow-hidden relative">
    
    <!-- Progress Bar -->
    <div class="absolute top-0 left-0 w-full h-1.5 bg-gray-100 z-50">
      <div id="progress-fill" class="h-full bg-black w-[25%] transition-all duration-700 ease-out"></div>
    </div>

    <!-- Header Section -->
    <header class="shrink-0 pt-14 px-6 pb-6 flex flex-col gap-4 bg-white z-10">
      <div class="flex items-center justify-between">
        <span id="step-indicator" class="px-2 py-1 rounded-md bg-gray-100 text-[11px] font-bold tracking-wider uppercase text-gray-600 border border-gray-200">
          Step 1 of 4
        </span>
        <button id="skip-btn" class="text-xs font-semibold text-gray-400 hover:text-black transition-colors px-2 py-1">
          Skip
        </button>
      </div>
      
      <div id="header-text" class="space-y-2">
        <h1 id="title" class="text-3xl font-bold tracking-tight text-black leading-tight">
          What brings you <br/>here?
        </h1>
        <p id="subtitle" class="text-sm text-gray-500 leading-relaxed max-w-[90%]">
          Select your primary goal to help us personalize your journey.
        </p>
      </div>
    </header>

    <!-- Main Scrollable Content -->
    <main id="step-content" class="flex-1 overflow-y-auto px-6 pb-8">
      <!-- Content injected by JS -->
    </main>

    <!-- Persistent Footer -->
    <footer class="shrink-0 px-6 pt-4 pb-[34px] bg-white border-t border-gray-100 shadow-[0_-4px_20px_rgba(0,0,0,0.03)] z-20">
      <button id="continue-btn" class="w-full h-14 bg-black text-white rounded-xl font-semibold text-[17px] tracking-wide hover:bg-gray-800 active:scale-[0.95] disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed transition-all flex items-center justify-center gap-2 shadow-lg shadow-gray-200">
        <span id="continue-text">Continue</span>
        <iconify-icon icon="lucide:arrow-right" class="text-lg"></iconify-icon>
      </button>
      <p id="footer-note" class="text-center mt-4 text-[11px] text-gray-400 font-medium">
        Step 1 of 4
      </p>
    </footer>

  </div>

  <script>
    const appState = {
      currentStep: 1,
      maxSteps: 4,
      data: {
        goal: null,
        interests: [],
        profile: { name: '', handle: '' },
        notifications: false
      }
    };

    const steps = {
      1: {
        title: "What brings you <br/>here?",
        subtitle: "Select your primary goal to help us personalize your journey.",
        render: () => `
          <div class="grid grid-cols-1 gap-4 animate-in">
            ${['Learn new skills', 'Stay informed', 'Career advancement', 'Networking'].map(goal => `
              <button class="selectable-card group relative w-full text-left p-5 rounded-xl border ${appState.data.goal === goal ? 'border-2 border-black bg-gray-50' : 'border-gray-200 bg-white'} transition-all duration-200 active:scale-[0.98]" data-value="${goal}">
                <div class="flex items-center justify-between">
                  <span class="text-lg ${appState.data.goal === goal ? 'font-bold text-black' : 'font-semibold text-gray-900'}">${goal}</span>
                  <div class="shrink-0 w-6 h-6 rounded-full ${appState.data.goal === goal ? 'bg-black' : 'border border-gray-300 bg-white'} flex items-center justify-center transition-colors">
                    ${appState.data.goal === goal ? '<iconify-icon icon="lucide:check" class="text-white text-sm"></iconify-icon>' : ''}
                  </div>
                </div>
              </button>
            `).join('')}
          </div>`
      },
      2: {
        title: "Select your <br/>interests",
        subtitle: "Choose at least 1 topic. We'll curate your feed accordingly.",
        render: () => `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 animate-in">
            ${[
              { id: 'tech', label: 'Technology', sub: 'Gadgets & AI' },
              { id: 'design', label: 'Design', sub: 'UI, UX & Art' },
              { id: 'business', label: 'Business', sub: 'Startups & Finance' },
              { id: 'prod', label: 'Productivity', sub: 'Workflow & Tools' },
              { id: 'market', label: 'Marketing', sub: 'Growth & Social' },
              { id: 'life', label: 'Lifestyle', sub: 'Travel & Health' }
            ].map(item => {
              const isSelected = appState.data.interests.includes(item.id);
              return `
                <button class="interest-card group relative w-full text-left p-5 rounded-xl border ${isSelected ? 'border-2 border-black bg-gray-50' : 'border-gray-200 bg-white'} transition-all duration-200 active:scale-[0.98]" data-id="${item.id}">
                  <div class="flex items-start justify-between gap-3">
                    <div class="space-y-1.5">
                      <h3 class="text-lg ${isSelected ? 'font-bold text-black' : 'font-semibold text-gray-900'}">${item.label}</h3>
                      <p class="text-xs ${isSelected ? 'font-medium text-gray-600' : 'text-gray-500'} leading-tight">${item.sub}</p>
                    </div>
                    <div class="shrink-0 w-6 h-6 rounded-full ${isSelected ? 'bg-black' : 'border border-gray-300 bg-white'} flex items-center justify-center transition-colors">
                      ${isSelected ? '<iconify-icon icon="lucide:check" class="text-white text-sm"></iconify-icon>' : ''}
                    </div>
                  </div>
                </button>
              `;
            }).join('')}
          </div>`
      },
      3: {
        title: "Tell us about <br/>yourself",
        subtitle: "Create your basic profile to start connecting with others.",
        render: () => `
          <div class="space-y-6 animate-in">
            <div class="flex justify-center mb-8">
              <div class="relative">
                <div class="w-24 h-24 rounded-full bg-gray-100 border-2 border-dashed border-gray-300 flex items-center justify-center">
                  <iconify-icon icon="lucide:user" class="text-4xl text-gray-400"></iconify-icon>
                </div>
                <button class="absolute bottom-0 right-0 w-8 h-8 bg-black text-white rounded-full flex items-center justify-center border-4 border-white shadow-lg">
                  <iconify-icon icon="lucide:camera" class="text-sm"></iconify-icon>
                </button>
              </div>
            </div>
            <div class="space-y-4">
              <div class="space-y-2">
                <label class="text-xs font-bold uppercase tracking-wider text-gray-500">Display Name</label>
                <input type="text" id="input-name" placeholder="e.g. Alex Johnson" class="w-full px-5 py-4 rounded-xl border border-gray-200 focus:border-black focus:ring-1 focus:ring-black outline-none transition-all" value="${appState.data.profile.name}">
              </div>
              <div class="space-y-2">
                <label class="text-xs font-bold uppercase tracking-wider text-gray-500">Username</label>
                <div class="relative">
                   <span class="absolute left-5 top-1/2 -translate-y-1/2 text-gray-400">@</span>
                   <input type="text" id="input-handle" placeholder="alex_j" class="w-full pl-10 pr-5 py-4 rounded-xl border border-gray-200 focus:border-black focus:ring-1 focus:ring-black outline-none transition-all" value="${appState.data.profile.handle}">
                </div>
              </div>
            </div>
          </div>`
      },
      4: {
        title: "Stay in the <br/>loop",
        subtitle: "Get notified about new trends, updates and messages.",
        render: () => `
          <div class="flex flex-col items-center justify-center py-8 text-center animate-in">
            <div class="w-24 h-24 bg-gray-50 rounded-3xl flex items-center justify-center mb-6">
              <iconify-icon icon="lucide:bell" class="text-5xl text-black ${appState.data.notifications ? 'animate-bounce' : ''}"></iconify-icon>
            </div>
            <h2 class="text-xl font-bold mb-2">Enable Push Notifications</h2>
            <p class="text-sm text-gray-500 mb-8 max-w-[240px]">We promise not to spam you with unnecessary alerts.</p>
            
            <button id="toggle-notifications" class="group flex items-center gap-3 px-6 py-4 rounded-full border-2 ${appState.data.notifications ? 'border-black bg-gray-50' : 'border-gray-200'} transition-all">
               <div class="w-12 h-6 rounded-full ${appState.data.notifications ? 'bg-black' : 'bg-gray-200'} relative transition-colors duration-300">
                  <div class="absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-transform duration-300 ${appState.data.notifications ? 'translate-x-6' : ''}"></div>
               </div>
               <span class="font-semibold">${appState.data.notifications ? 'Enabled' : 'Disabled'}</span>
            </button>
          </div>`
      }
    };

    function updateUI() {
      const stepIndicator = document.getElementById('step-indicator');
      const progressFill = document.getElementById('progress-fill');
      const title = document.getElementById('title');
      const subtitle = document.getElementById('subtitle');
      const main = document.getElementById('step-content');
      const continueBtn = document.getElementById('continue-btn');
      const continueText = document.getElementById('continue-text');
      const footerNote = document.getElementById('footer-note');
      
      const currentStepData = steps[appState.currentStep];
      
      const render = () => {
        stepIndicator.textContent = `Step ${appState.currentStep} of ${appState.maxSteps}`;
        progressFill.style.width = `${(appState.currentStep / appState.maxSteps) * 100}%`;
        title.innerHTML = currentStepData.title;
        subtitle.textContent = currentStepData.subtitle;
        main.innerHTML = currentStepData.render();
        footerNote.textContent = `Step ${appState.currentStep} of ${appState.maxSteps}`;
        
        if (appState.currentStep === appState.maxSteps) {
          continueText.textContent = "Finish Setup";
        } else {
          continueText.textContent = "Continue";
        }

        validate();
        attachListeners();
      };

      if (document.startViewTransition) {
        document.startViewTransition(render);
      } else {
        render();
      }
    }

    function validate() {
      const btn = document.getElementById('continue-btn');
      let isValid = false;
      
      if (appState.currentStep === 1) isValid = !!appState.data.goal;
      else if (appState.currentStep === 2) isValid = appState.data.interests.length > 0;
      else if (appState.currentStep === 3) isValid = appState.data.profile.name.length > 2 && appState.data.profile.handle.length > 2;
      else if (appState.currentStep === 4) isValid = true;

      btn.disabled = !isValid;
    }

    function attachListeners() {
      // Step 1 Click
      document.querySelectorAll('.selectable-card').forEach(card => {
        card.onclick = () => {
          appState.data.goal = card.dataset.value;
          updateUI();
        };
      });

      // Step 2 Click
      document.querySelectorAll('.interest-card').forEach(card => {
        card.onclick = () => {
          const id = card.dataset.id;
          if (appState.data.interests.includes(id)) {
            appState.data.interests = appState.data.interests.filter(i => i !== id);
          } else {
            appState.data.interests.push(id);
          }
          updateUI();
        };
      });

      // Step 3 Inputs
      const nameInput = document.getElementById('input-name');
      const handleInput = document.getElementById('input-handle');
      if (nameInput) {
        nameInput.oninput = (e) => {
          appState.data.profile.name = e.target.value;
          validate();
        };
      }
      if (handleInput) {
        handleInput.oninput = (e) => {
          appState.data.profile.handle = e.target.value;
          validate();
        };
      }

      // Step 4 Click
      const notifyToggle = document.getElementById('toggle-notifications');
      if (notifyToggle) {
        notifyToggle.onclick = () => {
          appState.data.notifications = !appState.data.notifications;
          updateUI();
        };
      }
    }

    document.getElementById('continue-btn').onclick = () => {
      if (appState.currentStep < appState.maxSteps) {
        appState.currentStep++;
        updateUI();
      } else {
        const btn = document.getElementById('continue-btn');
        btn.innerHTML = '<iconify-icon icon="lucide:loader-2" class="animate-spin text-xl"></iconify-icon>';
        setTimeout(() => {
          alert("Welcome aboard! Your journey begins now.");
          location.reload();
        }, 1200);
      }
    };

    document.getElementById('skip-btn').onclick = () => {
      if (appState.currentStep < appState.maxSteps) {
        appState.currentStep++;
        updateUI();
      }
    };

    // Start flow
    updateUI();
  </script>
</body>
</html>
