<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radial Orbital Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --void:#070A0F; --panel:#0D131B; --bone:#E8EEF5; --muted:#7C8798;
  --live:#3DE0D0; --dim:rgba(232,238,245,.14); --dim-2:rgba(232,238,245,.07);
  --sans:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --n:6;            /* node count */
  --spin:0turn;     /* driven by scroll */
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--void);color:var(--bone);font-family:var(--sans);font-weight:300;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* the stage is tall; the orbit pins inside it and scroll rotates the ring */
.stage{position:relative;height:520svh}
.pin{position:sticky;top:0;height:100svh;overflow:hidden;display:grid;place-items:center}

.orbit{position:relative;width:min(78vmin,720px);aspect-ratio:1/1;
  transform:rotate(var(--spin));transition:transform .06s linear}
/* rings are drawn, not imaged */
.ring{position:absolute;inset:0;border:1px solid var(--dim-2);border-radius:50%}
.ring.r2{inset:13%}
.ring.r3{inset:26%;border-color:var(--dim)}
.ring.tick{inset:26%;border:0;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,var(--dim-2) 0deg .35deg,transparent .35deg 15deg);
  -webkit-mask-image:radial-gradient(circle closest-side at 50% 50%,transparent 0 90%,#000 93%);
  mask-image:radial-gradient(circle closest-side at 50% 50%,transparent 0 90%,#000 93%)}

/* each node sits on the ring: rotate to its slot, push out, then counter-rotate
   by the same angle plus the stage spin so the dot never appears tilted */
.node{position:absolute;inset:0;
  transform:rotate(calc(var(--i) * (1turn / var(--n))))}
.node i{position:absolute;left:50%;top:0;display:block;width:13px;height:13px;margin-left:-6.5px;
  margin-top:-6.5px;border-radius:50%;background:var(--void);border:1px solid var(--dim);
  transform:rotate(calc(-1 * var(--i) * (1turn / var(--n)) - var(--spin)));
  transition:background .45s var(--ease),border-color .45s var(--ease),box-shadow .45s var(--ease)}
.node.on i{background:var(--live);border-color:var(--live);
  box-shadow:0 0 0 5px rgba(61,224,208,.14),0 0 22px rgba(61,224,208,.5)}
.node b{position:absolute;left:50%;top:0;transform-origin:0 0;
  transform:translate(14px,-7px) rotate(calc(-1 * var(--i) * (1turn / var(--n)) - var(--spin)));
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);
  white-space:nowrap;transition:color .45s var(--ease)}
.node.on b{color:var(--live)}

/* the hub reads the active entry; it never rotates */
.hub{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.card{width:min(64%,340px);text-align:center}
.card .yr{font-size:clamp(2.6rem,7vmin,4.4rem);font-weight:300;letter-spacing:-.04em;
  line-height:1;color:var(--live)}
.card h3{margin-top:10px;font-size:clamp(1rem,2.1vmin,1.25rem);font-weight:500;letter-spacing:-.01em}
.card p{margin-top:8px;font-size:13px;line-height:1.6;color:var(--muted)}
.card .swap{transition:opacity .32s var(--ease),transform .32s var(--ease)}
.card .swap.out{opacity:0;transform:translateY(6px)}

/* progress arc: a conic sweep clipped to a thin ring */
.sweep{position:absolute;inset:26%;border-radius:50%;pointer-events:none;opacity:.7;
  background:conic-gradient(var(--live) calc(var(--p) * 360deg),transparent 0);
  -webkit-mask-image:radial-gradient(circle closest-side at 50% 50%,transparent 0 95%,#000 97%);
  mask-image:radial-gradient(circle closest-side at 50% 50%,transparent 0 95%,#000 97%)}

.meta{position:absolute;left:clamp(16px,4vw,44px);right:clamp(16px,4vw,44px);
  bottom:clamp(16px,3.5vw,38px);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
  z-index:3}
.hint{position:absolute;left:50%;top:clamp(16px,3.5vw,38px);transform:translateX(-50%);z-index:3;
  opacity:calc(1 - var(--p) * 6)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  /* no rotation and no pin: fall back to a legible vertical list */
  .stage{height:auto}
  .pin{position:static;height:auto;padding:48px 0;display:block}
  .orbit{display:none}
  .hub{position:static;transform:none;display:block}
  .fallback{display:block!important}
  .hint{display:none}
}
.fallback{display:none;max-width:640px;margin:0 auto;padding:0 20px}
.fallback li{list-style:none;padding:16px 0;border-bottom:1px solid var(--dim-2);display:grid;
  grid-template-columns:78px 1fr;gap:16px;align-items:baseline}
.fallback .yr2{font-family:var(--mono);font-size:12px;color:var(--live)}
.fallback b{display:block;font-weight:500;font-size:15px;margin-bottom:3px}
.fallback span{font-size:13px;line-height:1.55;color:var(--muted)}
</style>

        nestedElements.forEach(function(nested) {
          var nestedId = nested.getAttribute('componentid') || nested.getAttribute('ref');
          if (nestedId && !componentRegistry.has(nestedId)) {
            missingIds.push(nestedId);
          }
        });

        if (missingIds.length > 0) {
          // Fetch missing nested components, then render
          loadComponentsByIds(missingIds).then(function() {
            nestedElements.forEach(function(nested) {
              if (!nested.getAttribute('data-rendered')) {
                renderComponent(nested, depth + 1);
              }
            });
          });
        } else {
          // All nested definitions already loaded — render immediately
          nestedElements.forEach(function(nested) {
            if (!nested.getAttribute('data-rendered')) {
              renderComponent(nested, depth + 1);
            }
          });
        }
      }
    }

    function updateComponentInstances(componentId) {
      var elements = document.querySelectorAll('sd-component[componentid="' + componentId + '"], sd-component[ref="' + componentId + '"]');
      elements.forEach(function(el) { renderComponent(el); });
    }

    function initializeComponents() {
      var elements = document.querySelectorAll('sd-component[componentid], sd-component[ref]');
      elements.forEach(function(el) {
        if (!el.getAttribute('data-rendered')) { renderComponent(el); }
      });
    }

    async function loadComponentsByIds(ids) {
      if (!ids || ids.length === 0) return;
      // Deduplicate and filter already-loaded
      var uniqueIds = ids.filter(function(id, i, arr) {
        return arr.indexOf(id) === i && !componentRegistry.has(id);
      });
      if (uniqueIds.length === 0) return;

      try {
        console.log('[SDComponent] Batch loading components:', uniqueIds);
        var response = await fetch(API_BASE + '/v1/design-drafts/components/batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ componentIds: uniqueIds }),
        });
        if (!response.ok) throw new Error('Batch load failed: ' + response.status);
        var components = await response.json();
        console.log('[SDComponent] Batch loaded', components.length, 'components');
        components.forEach(function(comp) { registerComponent(comp.id, comp); });
      } catch (error) {
        console.error('[SDComponent] Failed to batch load components:', error);
      }
    }

    async function loadComponentsForDraft() {
      if (!DRAFT_ID) {
        console.warn('[SDComponent] No draft ID configured');
        showPage();
        return;
      }
      try {
        console.log('[SDComponent] Loading components for draft:', DRAFT_ID);
        var response = await fetch(API_BASE + '/v1/design-drafts/' + DRAFT_ID + '/components', {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' },
        });
        if (!response.ok) throw new Error('Failed to load components: ' + response.status);
        var components = await response.json();
        console.log('[SDComponent] Loaded', components.length, 'components');
        components.forEach(function(comp) { registerComponent(comp.id, comp); });
        initializeComponents();
        showPage();
      } catch (error) {
        console.error('[SDComponent] Failed to load components:', error);
        showPage();
      }
    }

    function findReferencedComponents() {
      var elements = document.querySelectorAll('sd-component[componentid], sd-component[ref]');
      var ids = new Set();
      elements.forEach(function(el) {
        var ref = el.getAttribute('componentid') || el.getAttribute('ref');
        if (ref) ids.add(ref);
      });
      return Array.from(ids);
    }

    window.__SD_COMPONENTS__ = {
      register: registerComponent,
      render: renderComponent,
      update: updateComponentInstances,
      loadForDraft: loadComponentsForDraft,
      loadByIds: loadComponentsByIds,
      init: initializeComponents,
      findRefs: findReferencedComponents,
      getRegistry: function() { return componentRegistry; },
      getInstances: function() { return instanceRegistry; },
      getDraftId: function() { return DRAFT_ID; },
    };

    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'SD_COMPONENT_UPDATE') {
        var cId = event.data.componentId;
        var def = event.data.definition;
        if (cId && def) { registerComponent(cId, def); updateComponentInstances(cId); }
      }
      if (event.data && event.data.type === 'SD_COMPONENTS_REGISTER') {
        var comps = event.data.components;
        if (Array.isArray(comps)) {
          comps.forEach(function(c) { registerComponent(c.id, c); });
          initializeComponents();
        }
      }
    });

    function bootComponents() {
      // Pre-register components from __SD_COMPONENT_PRELOAD__ (injected by backend for standalone previews)
      if (window.__SD_COMPONENT_PRELOAD__ && Array.isArray(window.__SD_COMPONENT_PRELOAD__)) {
        console.log('[SDComponent] Pre-registering', window.__SD_COMPONENT_PRELOAD__.length, 'preloaded components');
        window.__SD_COMPONENT_PRELOAD__.forEach(function(comp) {
          registerComponent(comp.id, comp);
        });
      }

      var refs = findReferencedComponents();
      var unloaded = refs.filter(function(id) { return !componentRegistry.has(id); });

      if (unloaded.length > 0) {
        if (DRAFT_ID) {
          loadComponentsForDraft();
        } else {
          // No draft ID — try batch loading the missing IDs directly
          loadComponentsByIds(unloaded).then(function() {
            initializeComponents();
            showPage();
          });
        }
      } else if (refs.length > 0) {
        // All components already registered (e.g. from preload) — render immediately
        initializeComponents();
        showPage();
      } else {
        showPage();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootComponents);
    } else {
      bootComponents();
    }

    var observer = new MutationObserver(function(mutations) {
      var hasNew = false;
      mutations.forEach(function(m) {
        m.addedNodes.forEach(function(node) {
          if (node.nodeType === 1) {
            if (node.tagName === 'SD-COMPONENT') { hasNew = true; }
            else if (node.querySelector) {
              if (node.querySelectorAll('sd-component[componentid], sd-component[ref]').length > 0) hasNew = true;
            }
          }
        });
      });
      if (hasNew) {
        var refs = findReferencedComponents();
        var unloaded = refs.filter(function(id) { return !componentRegistry.has(id); });
        if (unloaded.length > 0) {
          loadComponentsByIds(unloaded).then(function() {
            initializeComponents();
          });
        } else {
          initializeComponents();
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    console.log('[SDComponent] Runtime initialized');
  })();
  </script>
</head>
<body>

<section class="stage" id="stage">
  <div class="pin">
    <span class="hint mono">Scroll to advance the orbit</span>

    <div class="orbit" id="orbit">
      <div class="ring"></div><div class="ring r2"></div>
      <div class="ring tick"></div><div class="ring r3"></div>
      <div class="sweep" id="sweep"></div>
      <!-- nodes injected -->
    </div>

    <div class="hub">
      <div class="card">
        <div class="yr swap" id="yr">1994</div>
        <h3 class="swap" id="ttl">First transmission</h3>
        <p class="swap" id="bod">The array received its first usable signal, eleven months after the dishes were aligned.</p>
      </div>
    </div>

    <div class="meta">
      <span class="mono" id="idx">01 / 06</span>
      <span class="mono">Radial orbital timeline</span>
    </div>
  </div>

  <ul class="fallback" id="fallback"></ul>
</section>

<script>
(function(){
  "use strict";
  var RM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var root = document.documentElement;

  var ENTRIES = [
    {yr:"1994", t:"First transmission", b:"The array received its first usable signal, eleven months after the dishes were aligned."},
    {yr:"1999", t:"Second dish", b:"A second aperture doubled the collecting area and made interferometry possible for the first time."},
    {yr:"2006", t:"Open archive", b:"Every observation since commissioning was published, unfiltered, including the failed runs."},
    {yr:"2013", t:"Correlator rebuilt", b:"The signal path moved to software, which cut the latency from hours to under four minutes."},
    {yr:"2019", t:"Southern link", b:"A partner site 9,000km away joined the baseline and the resolution improved by two orders."},
    {yr:"2026", t:"Continuous survey", b:"The array stopped scheduling and now simply records everything above the horizon, always."}
  ];

  var orbit = document.getElementById("orbit");
  var N = ENTRIES.length;
  root.style.setProperty("--n", N);

  // nodes on the ring
  ENTRIES.forEach(function(e, i){
    var d = document.createElement("div");
    d.className = "node"; d.style.setProperty("--i", i);
    d.innerHTML = '<i></i><b>' + e.yr + '</b>';
    orbit.appendChild(d);
  });
  var nodes = [].slice.call(orbit.querySelectorAll(".node"));

  // reduced-motion / no-JS-friendly vertical list
  var fb = document.getElementById("fallback");
  ENTRIES.forEach(function(e){
    var li = document.createElement("li");
    li.innerHTML = '<span class="yr2">' + e.yr + '</span><div><b>' + e.t + '</b><span>' + e.b + '</span></div>';
    fb.appendChild(li);
  });

  var yr = document.getElementById("yr"), ttl = document.getElementById("ttl"),
      bod = document.getElementById("bod"), idx = document.getElementById("idx"),
      stage = document.getElementById("stage");
  var last = -1;

  function paint(i){
    if (i === last) return;
    last = i;
    var e = ENTRIES[i];
    // cross-fade the hub text rather than snapping it
    [yr, ttl, bod].forEach(function(n){ n.classList.add("out"); });
    setTimeout(function(){
      yr.textContent = e.yr; ttl.textContent = e.t; bod.textContent = e.b;
      [yr, ttl, bod].forEach(function(n){ n.classList.remove("out"); });
    }, 170);
    nodes.forEach(function(n, k){ n.classList.toggle("on", k === i); });
    idx.textContent = ("0" + (i + 1)).slice(-2) + " / " + ("0" + N).slice(-2);
  }

  function sync(){
    var r = stage.getBoundingClientRect();
    var p = -r.top / Math.max(1, r.height - window.innerHeight);
    p = p < 0 ? 0 : p > 1 ? 1 : p;
    root.style.setProperty("--p", p.toFixed(4));
    // rotate so the ACTIVE node sits at the top of the ring
    var exact = p * (N - 1);
    root.style.setProperty("--spin", (-exact / N) + "turn");
    paint(Math.round(exact));
  }

  if (RM) {
    paint(0);
  } else {
    var ticking = false;
    window.addEventListener("scroll", function(){
      if (ticking) return; ticking = true;
      requestAnimationFrame(function(){ sync(); ticking = false; });
    }, {passive:true});
    window.addEventListener("resize", sync, {passive:true});
    sync();
  }
})();
</script>
</body>
</html>
